<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<meta http-equiv="last-modified" content="{{- .Lastmod.Format "Mon, 02 Jan 2006 15:04:05 GMT" -}}">

{{ with .Description  }}
  <meta name="description" content="{{- .  -}}">
{{ else  }}
  <meta name="description" content="{{- site.Params.description  -}}">
{{ end  }}

<meta name="author" content="{{- site.Params.author  -}}">

<!-- Open Graph -->
<meta property="og:title" content="{{- if .IsHome  -}}{{- site.Title  -}}{{- else  -}}{{- .Title  -}} - {{- site.Title  -}}{{- end  -}}">
<meta property="og:description" content="{{- with .Description  -}}{{- .  -}}{{- else  -}}{{- site.Params.description  -}}{{- end  -}}">
<meta property="og:type" content="{{- if .IsPage  -}}article{{- else  -}}website{{- end  -}}">
<meta property="og:url" content="{{- .Permalink  -}}">
{{- if .IsPage }}
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
{{- with .Lastmod }}<meta property="article:modified_time" content="{{ .Format "2006-01-02T15:04:05Z07:00" }}">{{ end }}
{{- end }}

{{- with site.Params.favicon  -}}
  <link rel="shortcut icon" href="{{- . | relURL  -}}" type="image/x-icon">
  <link rel="icon" href="{{- . | relURL  -}}" type="image/x-icon">
{{- end  -}}

<!-- Canonical URL -->
<link rel="canonical" href="{{- .Permalink  -}}">

<!-- RSS -->
{{- with .OutputFormats.Get "rss"  -}}
  <link rel="{{- .Rel  -}}" type="{{- .MediaType.Type  -}}" href="{{- .Permalink  -}}" title="{{- $.Site.Title  -}}">
{{- end  -}}
