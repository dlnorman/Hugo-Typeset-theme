<nav class="main-nav" aria-label="Main navigation">
    <ul>
        {{- $currentPage := . -}}
        {{- range .Site.Menus.main -}}
            {{- if .HasChildren -}}
                <li class="dropdown{{ if $currentPage.HasMenuCurrent "main" . }} menu-current{{ end }}">
                    <a href="{{- .URL -}}" class="dropdown-toggle" aria-haspopup="true" aria-expanded="false">
                        {{- .Name -}}
                        <!-- Only one arrow here -->
                        <span class="caret" aria-hidden="true">▼</span>
                    </a>
                    <ul class="dropdown-menu">
                        {{- range .Children -}}
                            <li{{ if $currentPage.IsMenuCurrent "main" . }} class="menu-current"{{ end }}>
                                <a href="{{- .URL -}}">{{- .Name -}}</a>
                            </li>
                        {{- end -}}
                    </ul>
                </li>
            {{- else -}}
                <li{{ if $currentPage.IsMenuCurrent "main" . }} class="menu-current"{{ end }}>
                    <a href="{{- .URL -}}">{{- .Name -}}</a>
                </li>
            {{- end -}}
        {{- end -}}
    </ul>
</nav>
