{{ range hugo.Data.blogroll.body.outline }}
	<h2>{{ index . "-text" }}</h2>
	<ul>
	{{ range index . "outline" }}
		<li><a href='{{ index . "-htmlUrl" }}'>{{ index . "-text" }}</a> (<a href='{{ index . "-xmlUrl" }}'>feed</a>)</li>
	{{ end }}
	</ul>
{{ end }}

<hr>
<p><small>Blogroll last updated on {{ dateFormat "Monday, January 2, 2006" (os.Stat "data/blogroll.xml").ModTime }}</small></p>
