{{ define "main" }}
<article class="github-projects">
  <header>
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </header>

  <div id="github-repos">
    <p>Loading repositories...</p>
  </div>

  <script>
    const username = 'dlnorman'; // Change this to your GitHub username
    const reposContainer = document.getElementById('github-repos');

    async function fetchGitHubRepos() {
      try {
        const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=100`);
        
        if (!response.ok) {
          throw new Error('Failed to fetch repositories');
        }

        const repos = await response.json();
        
        // Filter out forks if you want, and sort by stars or last updated
        const filteredRepos = repos
          .filter(repo => !repo.fork) // Remove this line if you want to include forks
		//.sort((a, b) => b.stargazers_count - a.stargazers_count); // sort by stars
		  .sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at)); // sort by last-updated
        displayRepos(filteredRepos);
      } catch (error) {
        reposContainer.innerHTML = `<p class="error">Error loading repositories: ${error.message}</p>`;
      }
    }

    function displayRepos(repos) {
      if (repos.length === 0) {
        reposContainer.innerHTML = '<p>No repositories found.</p>';
        return;
      }

      const reposList = repos.map(repo => `
        <article class="repo-card">
          <h2>
            <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">
              ${repo.name}
            </a>
          </h2>
          
          ${repo.description ? `<p class="description">${repo.description}</p>` : ''}
          
          <div class="repo-meta">
            ${repo.language ? `<span class="language">${repo.language}</span>` : ''}
            <span class="stars">⭐ ${repo.stargazers_count}</span>
            <span class="forks">🍴 ${repo.forks_count}</span>
            <span class="updated">Updated: ${new Date(repo.updated_at).toLocaleDateString()}</span>
          </div>
          
          ${repo.homepage ? `<p class="homepage"><a href="${repo.homepage}" target="_blank" rel="noopener noreferrer">🔗 Project Homepage</a></p>` : ''}
        </article>
      `).join('');

      reposContainer.innerHTML = reposList;
    }

    fetchGitHubRepos();
  </script>

  <style>
    .github-projects {
      max-width: 800px;
      margin: 0 auto;
    }

    #github-repos {
      margin-top: 2rem;
    }

    .repo-card {
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      background: #fff;
    }

    .repo-card h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
    }

    .repo-card h2 a {
      color: #0366d6;
      text-decoration: none;
    }

    .repo-card h2 a:hover {
      text-decoration: underline;
    }

    .description {
      color: #586069;
      margin: 0.5rem 0;
    }

    .repo-meta {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      font-size: 0.875rem;
      color: #586069;
      margin-top: 0.75rem;
    }

    .language {
      font-weight: 600;
    }

    .homepage {
      margin-top: 0.5rem;
      font-size: 0.875rem;
    }

    .homepage a {
      color: #0366d6;
    }

    .error {
      color: #d73a49;
      padding: 1rem;
      background: #ffeef0;
      border-radius: 6px;
    }
  </style>
</article>
{{ end }}
